[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "landcoverrewind"
version = "1.3.1"
description = "Built-up land and land cover 1985-2025 from the Landsat archive for any area, with Random Forest label transfer and series constraints"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Grzegorz Górniak", email = "ggorniak@doktorant.umk.pl"}, {name = "Mieczysław Kunz"}]
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["landcoverrewind"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
